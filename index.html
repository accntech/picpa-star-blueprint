<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICPA STAR Membership Blueprint</title>
    <script>
      ;(() => {
        const storageKey = 'star-membership-theme'
        const themes = ['system', 'dark', 'light']

        try {
          const storedTheme = localStorage.getItem(storageKey)
          const preference = themes.includes(storedTheme) ? storedTheme : 'system'
          const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const activeTheme = preference === 'system' ? systemTheme : preference

          document.documentElement.dataset.themePreference = preference
          document.documentElement.dataset.theme = activeTheme
          document.documentElement.style.colorScheme = activeTheme
        } catch (error) {
          document.documentElement.dataset.themePreference = 'system'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
